<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12351f">
<meta name="robots" content="noindex,follow">
<title>Thank You | ACLG Lawn & Landscaping LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.thanks-main{min-height:calc(100vh - 180px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b2116,#12351f 65%,#20492d);padding:72px 24px}
.thanks-panel{max-width:740px;text-align:center;color:#fff}
.thanks-icon{width:72px;height:72px;border:2px solid #d9d1a3;border-radius:50%;display:grid;place-items:center;margin:0 auto 30px;color:#d9d1a3;font-size:38px;line-height:1}
.thanks-panel h1{font-family:'Playfair Display',serif;font-size:clamp(44px,7vw,76px);font-weight:600;line-height:1.12;margin:0 0 18px}
.thanks-panel h2{font-size:clamp(18px,3vw,24px);font-weight:600;margin:0 0 20px}
.thanks-panel p{font-size:17px;line-height:1.75;color:#e2e7df;margin:0 auto 32px;max-width:580px}
.thanks-panel .button{display:inline-block}
.thanks-tagline{margin-top:48px;color:#d9d1a3;letter-spacing:.18em;font-size:12px;font-weight:700}
@media(max-width:600px){.thanks-main{padding:64px 20px}.site-header{justify-content:center}.brand{width:190px}}
</style>
</head>
<body>
<header class="site-header"><a href="./" class="brand" aria-label="Return to ACLG homepage"><img src="assets/aclg-logo.png" alt="ACLG Landscaping logo"></a></header>
<main class="thanks-main"><div class="thanks-panel" role="status">
<div class="thanks-icon" aria-hidden="true">✓</div>
<h1>Thank You!</h1>
<h2>Your Request Has Been Received.</h2>
<p>Thank you for reaching out to ACLG Lawn & Landscaping! We've received your estimate request and will be in touch as soon as possible.</p>
<a class="button button-gold" href="./">Return to Homepage <span aria-hidden="true">↗</span></a>
<div class="thanks-tagline">RELIABLE CRAFT. LOCAL PRIDE.</div>
</div></main>
<footer><div class="container footer-bottom"><span>© ACLG Lawn & Landscaping LLC</span><span>Designed with care. Built to grow.</span></div></footer>
</body>
</html>
